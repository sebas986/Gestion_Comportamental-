<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Acudiente - Seguimiento de Hijos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <!-- ============================================
         BARRA DE NAVEGACIÓN
         ============================================ -->
    <div class="barra-nav">
        <span>
            <i class="bi bi-people-fill"></i> SESIÓN: PADRE DE FAMILIA / ACUDIENTE
        </span>
        <a href="admin_anotaciones.html">
            <i class="bi bi-person-badge-fill"></i> Ir a Vista Administrativa
        </a>
    </div>

    <!-- ============================================
         CONTENIDO PRINCIPAL
         ============================================ -->
    <main class="formato">

        <!-- Encabezado institucional -->
        <table class="encabezado">
            <tr>
                <td style="width: 100px; text-align: center;">
                    <!-- LOGO CON ETIQUETA IMG -->
                    <div class="logo-placeholder">
                        <img src="../../Img/LogoMc.png" alt="Logo Institucional">
                    </div>
                </td>
                <td style="text-align: center;">
                    <h2 style="margin: 2px 0; font-size: 18px;">
                        INSTITUCIÓN EDUCATIVA MARÍA DE LOS ÁNGELES CANO MÁRQUEZ
                    </h2>
                    <h3 style="margin: 5px 0; font-size: 16px; color: #0066cc;">
                        PORTAL DE SEGUIMIENTO PARA ACUDIENTES
                    </h3>
                </td>
            </tr>
        </table>

        <!-- Selector de hijo a cargo -->
        <div style="background: #e9ecef; border: 1px solid black; padding: 15px; margin-bottom: 15px;">
            <label style="font-weight: bold;">
                <i class="bi bi-person-bounding-box"></i> Seleccione un estudiante (Hijo):
            </label>
            <select id="selectHijoPadre" onchange="cambiarHijoPadre()">
                <!-- Se llena dinámicamente -->
            </select>
        </div>

        <!-- Selector de fecha -->
        <div style="background: #f8f9fa; border: 1px solid black; padding: 15px; margin-bottom: 15px;">
            <label style="font-weight: bold;">
                <i class="bi bi-calendar-event"></i> Seleccione fecha de observación:
            </label>
            <select id="selectFechaPadre" onchange="cargarAnotacionPadre()">
                <!-- Se llena dinámicamente -->
            </select>
        </div>

        <!-- Vista de la observación -->
        <div id="contenedorPadreAnotacion" class="tarjeta hidden">

            <h3 id="padreMotivo" style="margin-top: 0; color: #002244;">Motivo</h3>

            <!-- Datos generales de la anotación -->
            <table>
                <tr>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Tipo</th>
                    <th>Situación</th>
                    <th>Registrado por</th>
                </tr>
                <tr>
                    <td><input type="text" id="padreFecha" disabled></td>
                    <td><input type="text" id="padreHora" disabled></td>
                    <td><input type="text" id="padreTipo" disabled></td>
                    <td><input type="text" id="padreSituacion" disabled></td>
                    <td><input type="text" id="padreAutor" disabled></td>
                </tr>
            </table>

            <!-- Campos descriptivos -->
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold;">Descripción de la situación:</label>
                <textarea id="padreDescripcion" disabled></textarea>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold;">Descargos del estudiante:</label>
                <textarea id="padreDescargoEstudiante" disabled></textarea>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold;">Acciones pedagógicas u observaciones adicionales:</label>
                <textarea id="padreAcciones" disabled></textarea>
            </div>

            <!-- Firma del acudiente -->
            <div style="border-top: 1px solid #ccc; padding-top: 15px;">
                <h4 style="margin: 0 0 8px 0;">
                    <i class="bi bi-pen"></i> Confirmación de Notificación del Acudiente
                </h4>
                <input type="text"
                       id="inputFirmaAcudiente"
                       placeholder="Escriba su nombre completo para firmar notificación">
                <div style="margin-top: 8px; text-align: right;">
                    <button type="button" class="btn" onclick="confirmarFirmaAcudiente()">
                        <i class="bi bi-check-circle"></i> Confirmar Notificación
                    </button>
                </div>
            </div>

        </div>
    </main>
    <script src="Script.js"></script>

</body>
</html>
