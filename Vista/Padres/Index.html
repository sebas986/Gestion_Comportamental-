<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sidebar Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="Css_padre/Style.Css">
  <script src="JS/Script.js"></script>
</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar" class="sidebar d-flex flex-column">
    <!-- Encabezado con botón centrado -->
    <div class="sidebar-header">
      <button class="toggle-btn" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
      </button>
    </div>

    <!-- Opciones del menú -->
    <div class="menu-options">
      <a class="opcion" href="#">
        <i class="fa-solid fa-eye"></i>
        <span class="text">Ver anotación</span>
      </a>
      <a class="opcion" href="#">
        <i class="fa-solid fa-pen-nib"></i>
        <span class="text">Firmar</span>
      </a>
    </div>

    <!-- Dropdown de usuario -->
    <div class="user-dropdown">
      <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
        <img src="https://via.placeholder.com/32" alt="usuario" width="32" height="32" class="rounded-circle me-2">
        <strong class="text">mdo</strong>
      </a>
      <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
        <li><a class="dropdown-item" href="#">Perfil</a></li>
        <li><a class="dropdown-item" href="#">Configuración</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="../../Index.html">Cerrar sesión</a></li>
      </ul>
    </div>
  </div>

  <!-- Contenido -->
  <div class="content">
    <h1>Panel de Administración</h1>
    <p>Bienvenido al sistema de administración. Desde aquí puedes ver anotaciones y firmarlas.</p>
    
    <div class="card mt-4">
      <div class="card-body">
        <h5 class="card-title">Funcionalidades disponibles</h5>
        <ul class="card-text">
          <li>Visualización de anotaciones</li>
          <li>Firmar documentos o registros</li>
        </ul>
      </div>
    </div>
  </div>  

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }
  </script>
</body>
</html>
