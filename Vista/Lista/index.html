<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Grupos</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/Style.css">
</head>
<body>
    <!-- CAMBIO SEMÁNTICO Y MAIN ÚNICO: Se reemplaza <div class="main-container"> por <main class="main-container"> para encapsular el contenido principal único de la vista -->
    <main class="main-container">

        <!-- ===== BOTÓN VOLVER ===== -->
        <!-- CAMBIO ACCESIBILIDAD: Se añade aria-label para que los lectores de pantalla informen la función del enlace, ya que solo contiene un icono visual -->
        <a href="../Admin/Index.html" class="btn-volver" aria-label="Volver al panel principal">
            <i class="bi bi-arrow-left"></i>
        </a>

        <!-- ===== TARJETA ===== -->
        <!-- CAMBIO SEMÁNTICO: Se reemplaza <div class="card"> por <article class="card"> para definir un contenedor de contenido independiente -->
        <article class="card">
            <!-- CAMBIO SEMÁNTICO: Se reemplaza <div class="card-header"> por <header class="card-header"> para representar la cabecera interna de la tarjeta -->
            <header class="card-header">
                <i class="bi bi-people-fill"></i> Lista de Estudiantes por Grupo
            </header>
            <div class="card-body">

                <!-- ===== FILTROS CON SELECTS ===== -->
                <div class="filtros">
                    <!-- Selector de Grado -->
                    <div class="filtro-item">
                        <label for="selectGrado"><i class="bi bi-book"></i> Seleccionar grado</label>
                        <select id="selectGrado">
                            <option value="">Seleccione un grado</option>
                            <!-- Opciones generadas desde JS -->
                        </select>
                    </div>

                    <!-- Selector de Grupo -->
                    <div class="filtro-item">
                        <label for="selectGrupo"><i class="bi bi-people"></i> Seleccionar grupo</label>
                        <select id="selectGrupo" disabled>
                            <option value="">Primero seleccione un grado</option>
                        </select>
                    </div>
                </div>

                <!-- ===== TABLA DE ESTUDIANTES ===== -->
                <div class="tabla-wrapper">
                    <table class="tabla-estudiantes">
                        <thead>
                            <tr>
                                <!-- CAMBIO ACCESIBILIDAD: Se añade scope="col" a los encabezados para asociar las celdas con sus respectivas columnas en lectores de pantalla -->
                                <th scope="col" style="width: 40px">#</th>
                                <th scope="col">Nombres y Apellidos</th>
                                <th scope="col" style="width: 240px" class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaEstudiantes">
                            <tr><td colspan="3" class="empty-row">Seleccione un grado y grupo para ver los estudiantes</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="contador" id="contadorEstudiantes">
                    <i class="bi bi-info-circle"></i> Mostrando 0 estudiantes
                </div>

            </div>
        </article>

    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Js/Script.js"></script>
</body>
</html>
