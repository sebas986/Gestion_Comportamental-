<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de Estudiante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="css/Style.css">
  <script src="js/Script.js"></script>
</head>
<body>
  <!-- ===== PANEL IZQUIERDO ===== -->
  <!-- CAMBIO SEMÁNTICO: Se reemplaza <div class="left-panel"> por <aside> porque representa una barra o panel de información visual complementaria/decorativa -->
  <aside class="left-panel">
    <img src="../../Img/fondo.jpg" alt="Colegio" class="bg">
    <img src="../../Img/Logo.png" alt="Logo Gestión Comportamental" class="logo animate__animated animate__fadeInDown">
  </aside>

  <!-- ===== PANEL DERECHO ===== -->
  <!-- CAMBIO SEMÁNTICO Y MAIN: Se reemplaza <div class="right-panel"> por <main> para establecer que esta es la región con el contenido principal y central de la página -->
  <main class="right-panel">
    <div class="form-container animate__animated animate__fadeInUp">
      <h4 class="mb-3 animate__animated animate__bounceIn">
        <i class="bi bi-person-plus"></i> Registro de Estudiante
      </h4>

      <form id="formEstudiante" class="needs-validation" novalidate>

        <!-- ===== DATOS DEL ESTUDIANTE ===== -->
        <!-- CAMBIO SEMÁNTICO: Se reemplaza <div class="border-highlight mb-3"> por <section> para estructurar temáticamente la sección de los datos personales -->
        <section class="border-highlight mb-3">
          <div class="section-title text-primary-custom">
            <i class="bi bi-book"></i> Datos del Estudiante
          </div>
          
          <!-- Nombres y Apellidos separados -->
          <div class="row g-3">
            <div class="col-md-6">
              <label for="nombres" class="form-label">
                <i class="bi bi-person"></i> Nombres *
              </label>
              <input type="text" class="form-control" id="nombres" required placeholder="Ej: Juan Carlos">
              <div class="invalid-feedback">Por favor ingrese los nombres</div>
            </div>
            <div class="col-md-6">
              <label for="apellidos" class="form-label">
                <i class="bi bi-person"></i> Apellidos *
              </label>
              <input type="text" class="form-control" id="apellidos" required placeholder="Ej: Pérez Gómez">
              <div class="invalid-feedback">Por favor ingrese los apellidos</div>
            </div>
          </div>

          <!-- Tipo y número de documento -->
          <div class="row g-3 mt-2">
            <div class="col-md-6">
              <label for="tipoDoc" class="form-label">
                <i class="bi bi-card-text"></i> Tipo documento *
              </label>
              <select class="form-select" id="tipoDoc" required>
                <option value="">Seleccionar...</option>
                <option>CC</option>
                <option>TI</option>
                <option>RC</option>
                <option>Pasaporte</option>
              </select>
              <div class="invalid-feedback">Seleccione un tipo de documento</div>
            </div>
            <div class="col-md-6">
              <label for="documento" class="form-label">
                <i class="bi bi-hash"></i> N° Documento *
              </label>
              <input type="text" class="form-control" id="documento" required placeholder="Ej: 123456789">
              <div class="invalid-feedback">Ingrese el número de documento</div>
            </div>
          </div>

          <!-- Grado y Grupo -->
          <div class="row g-3 mt-2">
            <div class="col-md-6">
              <label for="grado" class="form-label">
                <i class="bi bi-bar-chart-steps"></i> Grado *
              </label>
              <select class="form-select" id="grado" required>
                <option value="">Seleccionar...</option>
                <option>Preescolar</option>
                <option>Primero</option>
                <option>Segundo</option>
                <option>Tercero</option>
                <option>Cuarto</option>
                <option>Quinto</option>
                <option>Sexto</option>
                <option>Séptimo</option>
                <option>Octavo</option>
                <option>Noveno</option>
                <option>Décimo</option>
                <option>Once</option>
              </select>
              <div class="invalid-feedback">Seleccione el grado</div>
            </div>
            <div class="col-md-6">
              <label for="grupo" class="form-label">
                <i class="bi bi-people"></i> Grupo *
              </label>
              <select class="form-select" id="grupo" required>
                <option value="">Seleccionar...</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
              </select>
              <div class="invalid-feedback">Seleccione el grupo</div>
            </div>
          </div>
        </section>
        
        <!-- ===== CONTRASEÑA ===== -->
        <div class="mb-3">
          <label for="password" class="form-label">
            <i class="bi bi-lock"></i> Contraseña <span class="text-muted">(opcional)</span>
          </label>
          <div class="password-input-group">
            <input type="password" class="form-control" id="password" minlength="6" placeholder="Mínimo 6 caracteres">
            <!-- CAMBIO ACCESIBILIDAD: Se agregan role="button", tabindex="0" y aria-label para informar al lector de pantalla sobre la función de este control interactivo -->
            <span class="password-toggle" onclick="togglePassword('password')" role="button" tabindex="0" aria-label="Mostrar u ocultar contraseña">
              <i class="bi bi-eye"></i>
            </span>
          </div>
          <div class="help-text">
            <i class="bi bi-shield-check"></i> Si no se asigna contraseña, se generará una automáticamente
          </div>
        </div>

        <hr class="my-4">

        <button type="submit" class="w-100 btn btn-primary">
          <i class="bi bi-save me-2"></i> Registrar Estudiante
        </button>
      </form>
    </div>
  </main>
</body>
</html>
