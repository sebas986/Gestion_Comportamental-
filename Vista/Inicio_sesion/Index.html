<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Comportamental - Login</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="Style.css">
  <!-- Al final del body, antes de cerrar -->
  <script src="Script.js"></script> 
  </head>
<body>
  <!-- Imagen de fondo mediante etiqueta HTML -->
  <img class="background-img" src="../Img/fondo.jpg" alt="Fondo">
  <div class="overlay"></div>

  <!-- CAMBIO ACCESIBILIDAD: Se añade aria-label para describir el destino del enlace de retroceso a lectores de pantalla -->
  <a href="../../index.html" class="back-arrow" title="Volver al inicio" aria-label="Volver al inicio">
    <i class="fas fa-arrow-left"></i>
  </a>
  
  <!-- CAMBIO SEMÁNTICO Y MAIN ÚNICO: Se reemplaza <div class="container-login"> por <main> para establecer el contenedor principal de la página -->
  <main class="container-login">
    <!-- CAMBIO SEMÁNTICO: Se reemplaza <div class="login-box"> por <section> por ser una sección temática de ingreso -->
    <section class="login-box">
      <!-- CAMBIO SEMÁNTICO: Se reemplaza <div class="login-header"> por <header> para estructurar la cabecera de la sección -->
      <header class="login-header">
        <img src="../Img/Logo.png" alt="Sistema Comportamental">
      </header>

      <!-- Formulario con selector personalizado de roles (con iconos) -->
      <form id="loginForm">
        <div class="custom-select-wrapper" id="roleSelectWrapper">
          <div class="custom-select-trigger" id="roleSelectTrigger">
            <div class="selected-value">
              <i class="bi bi-person-circle"></i>
              <span>Selecciona tu rol</span>
            </div>
            <i class="bi bi-chevron-down arrow"></i>
          </div>
          <div class="custom-options" id="roleOptions">
            <div class="option-item" data-value="administrador" data-icon="bi bi-shield-lock">
              <i class="bi bi-shield-lock"></i>
              <span>Administrador</span>
            </div>
            <div class="option-item" data-value="docente" data-icon="bi bi-person-badge">
              <i class="bi bi-person-badge"></i>
              <span>Docente</span>
            </div>
            <div class="option-item" data-value="padre_familia" data-icon="bi bi-people">
              <i class="bi bi-people"></i>
              <span>Padre de familia</span>
            </div>
            <div class="option-item" data-value="estudiante" data-icon="bi bi-mortarboard">
              <i class="bi bi-mortarboard"></i>
              <span>Estudiante</span>
            </div>
          </div>
        </div>
        
        <!-- CAMBIO ASOCIACIÓN LABEL: Se añade <label> visualmente oculto para el select, asegurando accesibilidad -->
        <label for="rolHidden" class="visually-hidden">Selecciona tu rol</label>
        <select name="rol" id="rolHidden" class="hidden-select" required>
          <option value="" disabled selected>Selecciona tu rol</option>
          <option value="administrador">Administrador</option>
          <option value="docente">Docente</option>
          <option value="padre_familia">Padre de familia</option>
          <option value="estudiante">Estudiante</option>
        </select>

        <div class="mb-3">
          <!-- CAMBIO ASOCIACIÓN LABEL: Se añade etiqueta label (oculta) con un atributo for que coincide con el id del input. También se agregó el id="inputDocumento" al input -->
          <label for="inputDocumento" class="visually-hidden">Documento</label>
          <input type="text" id="inputDocumento" class="form-control" name="documento" placeholder="Documento" required>
        </div>
        <div class="mb-3 password-wrapper">
          <!-- CAMBIO ASOCIACIÓN LABEL: Se añade etiqueta label (oculta) vinculada al input de contraseña -->
          <label for="password" class="visually-hidden">Contraseña</label>
          <input type="password" id="password" class="form-control" name="contraseña" placeholder="Contraseña" required>
          
          <!-- CAMBIO ACCESIBILIDAD: Se agregan role="button", tabindex="0" y aria-label al icono para que sea reconocible e interactuable por lectores de pantalla y navegación de teclado -->
          <i class="fas fa-eye toggle-password" onclick="togglePassword()" role="button" tabindex="0" aria-label="Mostrar u ocultar contraseña"></i>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-custom">Iniciar Sesión</button>
      </form>
    </section>
  </main>
</body>
</html>
